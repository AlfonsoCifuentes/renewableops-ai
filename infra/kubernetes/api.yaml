apiVersion: apps/v1
kind: Deployment
metadata:
  name: renewableops-api
  namespace: renewableops-app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: renewableops-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: renewableops-api
        app.kubernetes.io/version: "1.0.0"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: renewableops-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: renewableops-config
            - secretRef:
                name: renewableops-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: renewableops-snapshot
---
apiVersion: v1
kind: Service
metadata:
  name: renewableops-api
  namespace: renewableops-app
spec:
  selector:
    app.kubernetes.io/name: renewableops-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: renewableops-snapshot
  namespace: renewableops-app
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 2Gi
