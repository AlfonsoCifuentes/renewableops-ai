name: renewableops-ai

x-common-env: &common-env
  APP_ENV: ${APP_ENV:-development}
  APP_TIMEZONE: Europe/Madrid
  RENEWABLEOPS_PROJECT_ROOT: /app
  PUBLIC_DEMO: "true"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: renewableops
  POSTGRES_USER: renewableops
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renewableops_local_only}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-renewableops}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-renewableops_local_only}
  MLFLOW_TRACKING_URI: http://mlflow:5000

services:
  postgres:
    image: postgres:17.5-alpine
    profiles: ["core"]
    environment:
      POSTGRES_DB: renewableops
      POSTGRES_USER: renewableops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renewableops_local_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renewableops -d renewableops"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["core"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-renewableops}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-renewableops_local_only}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks: [backend]

  mlflow:
    image: renewableops-mlflow:3.1.1
    build:
      context: .
      dockerfile: apps/mlflow/Dockerfile
    profiles: ["core"]
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg://renewableops:${POSTGRES_PASSWORD:-renewableops_local_only}@postgres:5432/renewableops
      - --artifacts-destination=s3://mlflow/
      - --serve-artifacts
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-renewableops}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-renewableops_local_only}
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["core"]
    environment: *common-env
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./data:/app/data
      - ./apps/dashboard/public/data:/app/apps/dashboard/public/data:ro
    depends_on:
      postgres: { condition: service_healthy }
      mlflow: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks: [backend, frontend]

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    profiles: ["core"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks: [frontend]

  n8n:
    image: n8nio/n8n:1.103.2
    profiles: ["core"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: renewableops
      DB_POSTGRESDB_USER: renewableops
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-renewableops_local_only}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-replace_before_shared_use}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: Europe/Madrid
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
    ports: ["127.0.0.1:5678:5678"]
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_healthy }
    volumes:
      - n8n-data:/home/node/.n8n
      - ./workflows/n8n:/workflows:ro
    restart: unless-stopped
    networks: [backend, egress]

  redis:
    image: redis:8.0.3-alpine
    profiles: ["streaming"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    restart: unless-stopped
    networks: [backend]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
    networks: [backend, frontend]

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-renewableops_local_only}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]
    restart: unless-stopped
    networks: [backend, frontend]

  loki:
    image: grafana/loki:3.5.2
    profiles: ["monitoring"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./infra/monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
    networks: [backend]

  spark-master:
    image: apache/spark:4.0.0
    profiles: ["scale"]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports: ["127.0.0.1:8088:8080"]
    networks: [backend]

  spark-worker:
    image: apache/spark:4.0.0
    profiles: ["scale"]
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 3g
      SPARK_NO_DAEMONIZE: "true"
    depends_on: [spark-master]
    networks: [backend]

networks:
  backend:
    internal: true
  frontend:
  egress:

volumes:
  postgres-data:
  minio-data:
  n8n-data:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:
