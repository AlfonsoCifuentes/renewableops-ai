resources:
  jobs:
    weekly_model_review:
      name: weekly_model_review_${bundle.target}
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 7 ? * MON"
        timezone_id: Europe/Madrid
        pause_status: PAUSED
      tasks:
        - task_key: evaluate_champion
          notebook_task:
            notebook_path: ../src/renewableops_databricks/model_review.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - mlflow>=3.0
              - scikit-learn>=1.6
